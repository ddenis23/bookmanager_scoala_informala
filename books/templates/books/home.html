
{% extends "base.html" %}

{% block title %}Books List{% endblock %}

{% block content %}
    <h1>Hello, this is our selection of books:</h1>
            <ul>
        <!--            template jinja.-->
                {% for book in books %}
                <li>
                  <details>
                    <summary>{{ book.title }} — by {{ book.author }}</summary>
                    <div>
                      {{ book.content }}
                    </div>
                    <a href="{% url 'delete_book' book.id %}">🗑️</a>
                    <a href="{% url 'update_book' book.id %}">✍️</a>
                  </details>
                </li>
                {% endfor %}
            </ul>

{% endblock %}
